# OpenOCD config for STM32 NUCLEO-H563ZI board

source [find interface/stlink-dap.cfg]

transport select dapdirect_swd

# Use the STM32H5 target driver: the CPU debug port is AP1, while AP0 is a
# memory access port. The legacy local HLA setup incorrectly treated AP0 as CPU.
set CHIPNAME stm32h5x
set WORKAREASIZE 0x8000

source [find openocd/stm32h5x.cfg]

